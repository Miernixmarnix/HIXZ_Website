<!DOCTYPE HTML>
<html>
	<head>
		<title>HIXZ - Aruba's Cinematic Hiking Experience</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		
		<meta property="og:title" content="HIXZ - Aruba's Cinematic Hiking Experience" />
		<meta property="og:description" content="Premium guided hikes with professional cinematic footage. Limited availability." />
		<meta property="og:image" content="https://www.hixzofficial.com/images/mainbackground.jpg" />
		<meta property="og:url" content="https://www.hixzofficial.com/links.html" />
		<meta property="og:type" content="website" />

		<link rel="icon" type="image/png" href="images/favicon.png">

		<!-- Preload hero background for instant render on mobile -->
		<link rel="preload" as="image" href="images/mainbackground.jpg">

		<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
		<link rel="stylesheet" href="assets/css/main.css" />
		<noscript><link rel="stylesheet" href="assets/css/noscript.css" /></noscript>

		<style>
			/* --- BASE OVERRIDE: Hero background with dark brand overlay --- */
			html, body {
				margin: 0 !important;
				padding: 0 !important;
				min-height: 100vh;
				font-family: 'Inter', sans-serif;
				-webkit-font-smoothing: antialiased;
				-moz-osx-font-smoothing: grayscale;
				color: #ffffff;
			}

			body {
				/* Layered: gradient overlay on top of hero image */
				background:
					linear-gradient(135deg, rgba(30, 43, 34, 0.82) 0%, rgba(43, 48, 54, 0.90) 100%),
					url('images/mainbackground.jpg') center center / cover no-repeat;
				background-color: #1e2b22; /* fallback while image loads */
			}

			/* --- MAIN WRAPPER --- */
			.links-wrapper {
				min-height: 100vh;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: space-between;
				padding: 3rem 1.5rem 2rem 1.5rem;
				box-sizing: border-box;
				opacity: 0;
				animation: fadeInPage 0.6s ease forwards 0.1s;
			}
			@keyframes fadeInPage { to { opacity: 1; } }

			.links-content {
				width: 100%;
				max-width: 440px;
				display: flex;
				flex-direction: column;
				align-items: center;
			}

			/* --- HEADER (Logo + Tagline) --- */
			.links-header {
				text-align: center;
				margin-bottom: 2.5rem;
			}
			.links-logo {
				width: 100%;
				max-width: 280px;
				height: auto;
				filter: drop-shadow(0px 4px 24px rgba(0, 0, 0, 0.5));
				margin-bottom: 1rem;
			}
			.links-tagline {
				color: rgba(255, 255, 255, 0.85);
				font-family: 'Inter', sans-serif;
				font-weight: 300;
				font-size: 0.95rem;
				letter-spacing: 3px;
				text-transform: uppercase;
				margin: 0;
				text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
			}

			/* --- BUTTON STACK --- */
			.links-stack {
				width: 100%;
				display: flex;
				flex-direction: column;
				gap: 14px;
			}

			/* --- BASE LINK BUTTON --- */
			.link-btn {
				display: flex;
				align-items: center;
				justify-content: center;
				width: 100%;
				min-height: 60px;
				padding: 18px 24px;
				border-radius: 50px;
				text-decoration: none;
				font-family: 'Archivo Black', sans-serif;
				font-size: 14px;
				letter-spacing: 1.5px;
				text-transform: uppercase;
				text-align: center;
				transition: all 0.25s ease;
				border: none;
				outline: none;
				cursor: pointer;
				box-sizing: border-box;
				line-height: 1.3;
				border-bottom: none !important;
			}
			.link-btn .btn-icon {
				margin-right: 10px;
				font-size: 1.05rem;
			}

			/* --- PRIMARY CTA: Sage Green (Website hub) --- */
			.link-btn-primary {
				background-color: #5ea66e;
				color: #ffffff !important;
				box-shadow: 0 10px 30px rgba(94, 166, 110, 0.45);
			}
			.link-btn-primary:hover {
				background-color: #4a8559;
				transform: translateY(-3px);
				box-shadow: 0 14px 36px rgba(94, 166, 110, 0.6);
			}

			/* --- SECONDARY: Dark glass (YouTube) --- */
			.link-btn-secondary {
				background-color: rgba(5, 10, 6, 0.85);
				color: #ffffff !important;
				border: 1px solid rgba(255, 255, 255, 0.18);
				backdrop-filter: blur(8px);
				-webkit-backdrop-filter: blur(8px);
				box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
			}
			.link-btn-secondary:hover {
				background-color: rgba(27, 48, 34, 0.95);
				transform: translateY(-2px);
				box-shadow: 0 10px 26px rgba(0, 0, 0, 0.4);
			}

			/* --- WAITLIST CARD --- */
			.waitlist-card {
				width: 100%;
				margin-top: 8px;
				padding: 1.75rem 1.5rem;
				background: rgba(94, 166, 110, 0.12);
				border: 1px solid rgba(94, 166, 110, 0.45);
				border-radius: 20px;
				text-align: center;
				box-sizing: border-box;
				backdrop-filter: blur(10px);
				-webkit-backdrop-filter: blur(10px);
				box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
			}
			.waitlist-label {
				display: inline-flex;
				align-items: center;
				gap: 8px;
				color: #8dd49d;
				font-family: 'Archivo Black', sans-serif;
				font-size: 0.7rem;
				letter-spacing: 2px;
				text-transform: uppercase;
				margin-bottom: 0.75rem;
			}
			.waitlist-label i { font-size: 0.85rem; }
			.waitlist-title {
				color: #ffffff;
				font-family: 'Archivo Black', sans-serif;
				font-size: 1.4rem;
				letter-spacing: 1px;
				text-transform: uppercase;
				margin: 0 0 0.5rem 0;
				text-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
			}
			.waitlist-text {
				color: rgba(255, 255, 255, 0.8);
				font-family: 'Inter', sans-serif;
				font-weight: 300;
				font-size: 0.9rem;
				line-height: 1.5;
				margin: 0 0 1.25rem 0;
			}
			.waitlist-btn {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				background-color: #ffffff;
				color: #1e2b22 !important;
				padding: 12px 32px;
				border-radius: 50px;
				text-decoration: none;
				font-family: 'Archivo Black', sans-serif;
				font-size: 12px;
				letter-spacing: 1.5px;
				text-transform: uppercase;
				border: none;
				cursor: pointer;
				transition: all 0.25s ease;
				border-bottom: none !important;
			}
			.waitlist-btn:hover {
				background-color: #5ea66e;
				color: #ffffff !important;
				transform: translateY(-2px);
			}

			/* --- FOOTER (Socials + Copyright) --- */
			.links-footer {
				margin-top: 3rem;
				text-align: center;
			}
			.links-socials {
				list-style: none;
				padding: 0;
				margin: 0 0 1rem 0;
				display: flex;
				justify-content: center;
				gap: 1.5rem;
			}
			.links-socials li { padding: 0; }
			.links-socials a {
				color: rgba(255, 255, 255, 0.8);
				font-size: 1.3rem;
				text-decoration: none;
				transition: all 0.2s ease;
				display: inline-block;
				border-bottom: none !important;
				text-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
			}
			.links-socials a:hover {
				color: #8dd49d;
				transform: translateY(-3px);
			}
			.links-socials .label { display: none; }
			.links-copyright {
				color: rgba(255, 255, 255, 0.5);
				font-family: 'Inter', sans-serif;
				font-weight: 300;
				font-size: 0.75rem;
				letter-spacing: 1px;
				margin: 0;
				text-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
			}

			/* --- MOBILE FINE-TUNING --- */
			@media screen and (max-width: 480px) {
				.links-wrapper { padding: 2rem 1.25rem 1.5rem 1.25rem; }
				.links-logo { max-width: 240px; }
				.links-tagline { font-size: 0.8rem; letter-spacing: 2px; }
				.link-btn { font-size: 13px; min-height: 56px; padding: 16px 20px; }
				.waitlist-title { font-size: 1.2rem; }
				.links-footer { margin-top: 2rem; }
			}
		</style>
	</head>
	<body>

		<div class="links-wrapper">

			<div class="links-content">

				<!-- HEADER: Logo + Tagline -->
				<header class="links-header">
					<img src="images/HIXZLogo2.png" alt="HIXZ Logo" class="links-logo" />
					<!-- Tagline alternatives: "Premium Guided Hikes • Aruba" | "Aruba's Hidden Trails, Filmed" | "Hike. Film. Remember." -->
					<p class="links-tagline">Aruba's Cinematic Hiking Experience</p>
				</header>

				<!-- LINK STACK -->
				<div class="links-stack">

					<!-- PRIMARY CTA: Website hub -->
					<a href="index.html" class="link-btn link-btn-primary">
						<i class="icon solid fa-mountain btn-icon"></i>
						Explore HIXZ
					</a>

					<!-- SECONDARY: YouTube films (data-source="yt" lets it auto-hide for visitors from YouTube) -->
					<a href="https://www.youtube.com/@MarnixHIXZ" target="_blank" rel="noopener" class="link-btn link-btn-secondary" data-source="yt">
						<i class="icon brands fa-youtube btn-icon"></i>
						Watch the Films
					</a>

					<!-- WAITLIST CARD: Kit form trigger -->
					<div class="waitlist-card">
						<div class="waitlist-label">
							<i class="icon solid fa-star"></i>
							Limited Availability
						</div>
						<h2 class="waitlist-title">Join the Waitlist</h2>
						<p class="waitlist-text">
							Small-group, off-season expeditions to hidden trails. Get notified before they sell out.
						</p>

						<!-- KIT FORM PLACEHOLDER -->
						<!-- The button below opens your existing Kit modal (uid 92566aafcc), same as index.html. -->
						<!-- TO SWAP TO INLINE EMBED: paste your Kit inline form script here in place of the button. -->
						<button data-formkit-toggle="92566aafcc" class="waitlist-btn">
							Sign Me Up
						</button>

					</div>

				</div>

			</div>

			<!-- FOOTER: Social Icons + Copyright -->
			<!-- data-source attributes let the script auto-hide whichever platform the visitor came from -->
			<footer class="links-footer">
				<ul class="links-socials">
					<li data-source="yt"><a href="https://www.youtube.com/@MarnixHIXZ" target="_blank" rel="noopener" class="icon brands fa-youtube"><span class="label">YouTube</span></a></li>
					<li data-source="ig"><a href="https://www.instagram.com/marnix_van_pelt/" target="_blank" rel="noopener" class="icon brands fa-instagram"><span class="label">Instagram</span></a></li>
					<li data-source="tiktok"><a href="https://www.tiktok.com/@ilikeh1xz" target="_blank" rel="noopener" class="icon brands fa-tiktok"><span class="label">TikTok</span></a></li>
					<li data-source="fb"><a href="https://www.facebook.com/profile.php?id=61560405287193" target="_blank" rel="noopener" class="icon brands fa-facebook-f"><span class="label">Facebook</span></a></li>
				</ul>
				<p class="links-copyright">&copy; HIXZ &bull; Built by Marnix van Pelt</p>
			</footer>

		</div>

		<!-- Kit modal script (matches index.html setup so the waitlist toggle works) -->
		<script async data-uid="92566aafcc" src="https://hixz.kit.com/92566aafcc/index.js"></script>

		<!-- SMART SOURCE DETECTION: hides the icon/button matching the platform the visitor came from -->
		<script>
			(function() {
				try {
					var params = new URLSearchParams(window.location.search);
					var source = (params.get('from') || '').toLowerCase().trim();
					if (!source) return;

					// Map common aliases to canonical source codes
					var aliasMap = {
						'tt': 'tiktok',
						'tiktok': 'tiktok',
						'ig': 'ig',
						'instagram': 'ig',
						'insta': 'ig',
						'fb': 'fb',
						'facebook': 'fb',
						'yt': 'yt',
						'youtube': 'yt'
					};
					var key = aliasMap[source];
					if (!key) return;

					// Hide every element whose data-source matches
					document.querySelectorAll('[data-source="' + key + '"]').forEach(function(el) {
						el.style.display = 'none';
					});
				} catch (e) {
					/* Fail silently — page still renders normally */
				}
			})();
		</script>

	</body>
</html>
