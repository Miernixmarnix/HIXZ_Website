<!DOCTYPE HTML>
<html>
	<head>
		<title>Alto Vista Map - HIXZ</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
		<link rel="stylesheet" href="../assets/css/main.css" />
		<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
		
		<style>
			body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #050a06; }
			
			#map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; background: #2a2a2a; }
			.leaflet-pane img, .leaflet-tile-container img { max-width: none !important; width: auto !important; }
			
			#header { position: absolute; top: 0; width: 100%; z-index: 1000; background: rgba(5, 10, 6, 0.8); height: 3.25em; line-height: 3.25em; }
			#header h1 { position: absolute; left: 50%; transform: translateX(-50%); margin: 0; }
			
			.back-btn {
				position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
				display: inline-flex; align-items: center; justify-content: center; gap: 6px;
				background: rgba(5, 10, 6, 0.6); color: rgba(255, 255, 255, 0.92) !important;
				padding: 9px 18px; border-radius: 50px; text-decoration: none;
				font-family: 'Archivo Black', sans-serif; font-size: 11px;
				letter-spacing: 1.5px; text-transform: uppercase; line-height: normal;
				border: 1px solid rgba(255, 255, 255, 0.18);
				backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
				box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
				transition: all 0.25s ease;
			}
			.back-btn:hover {
				background: rgba(94, 166, 110, 0.95); color: #ffffff !important;
				border-color: #5ea66e; transform: translateY(calc(-50% - 1px));
				box-shadow: 0 10px 24px rgba(94, 166, 110, 0.45);
			}

			.button-container {
				position: absolute; bottom: 40px; left: 0; width: 100%;
				display: flex; justify-content: center; z-index: 1000; pointer-events: none;
			}
			
			.google-btn {
				pointer-events: auto;
				display: inline-flex; align-items: center; justify-content: center; gap: 10px;
				background-color: #5ea66e; color: #ffffff !important; padding: 15px 38px;
				border-radius: 50px; text-decoration: none; font-family: 'Archivo Black', sans-serif;
				font-size: 14px; letter-spacing: 1.5px; text-transform: uppercase;
				border: none; cursor: pointer;
				box-shadow: 0 8px 24px rgba(94, 166, 110, 0.45);
				transition: all 0.25s ease;
			}
			.google-btn:hover {
				background-color: #4a8559; transform: translateY(-2px);
				box-shadow: 0 12px 30px rgba(94, 166, 110, 0.6);
			}
			.google-btn:active { transform: translateY(0); }

			#locating-overlay {
				position: absolute; top: 0; left: 0; width: 100%; height: 100%;
				background: rgba(5, 10, 6, 0.92); color: #ffffff;
				backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
				display: flex; align-items: center; justify-content: center;
				z-index: 9999; font-family: 'Archivo Black', sans-serif;
				font-size: 1.2rem; letter-spacing: 4px; text-transform: uppercase;
				opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
				animation: hixzLocatingPulse 1.4s ease-in-out infinite;
			}
			#locating-overlay.active { opacity: 1; pointer-events: all; }
			@keyframes hixzLocatingPulse {
				0%, 100% { color: rgba(255, 255, 255, 0.6); }
				50% { color: #ffffff; }
			}
			
			.leaflet-control-zoom, .leaflet-control-layers { margin-top: 80px !important; }
			
			.leaflet-control-layers-expanded {
				background: rgba(5, 10, 6, 0.78) !important;
				padding: 14px 16px !important;
				border-radius: 14px !important;
				border: 1px solid rgba(94, 166, 110, 0.45) !important;
				backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
				box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45) !important;
				color: #ffffff !important;
			}
			.leaflet-control-layers label {
				display: flex !important;
				align-items: center !important;
				color: rgba(255, 255, 255, 0.92) !important;
				font-family: 'Inter', sans-serif !important;
				font-weight: 500 !important;
				font-size: 0.85rem !important;
				letter-spacing: 0.5px !important;
				margin: 6px 0 !important;
				cursor: pointer !important;
				transition: color 0.2s ease;
			}
			.leaflet-control-layers label:hover { color: #8dd49d !important; }
			.leaflet-control-layers input[type="radio"] {
				appearance: none !important;
				-webkit-appearance: none !important;
				position: relative !important;
				width: 14px !important; height: 14px !important;
				border: 1.5px solid rgba(255, 255, 255, 0.4) !important;
				border-radius: 50% !important;
				margin-right: 10px !important;
				flex-shrink: 0 !important;
				cursor: pointer !important;
				transition: all 0.2s ease;
			}
			.leaflet-control-layers input[type="radio"]:checked {
				border-color: #5ea66e !important;
				background: #5ea66e !important;
				box-shadow: inset 0 0 0 3px rgba(5, 10, 6, 0.78) !important;
			}
			.leaflet-control-layers-separator { border-top-color: rgba(255, 255, 255, 0.1) !important; }

			#trail-stats {
				position: absolute;
				top: 220px;
				right: 15px;
				background: rgba(5, 10, 6, 0.78);
				color: #ffffff;
				padding: 16px 20px;
				border-radius: 14px;
				border: 1px solid rgba(94, 166, 110, 0.45);
				backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
				z-index: 1000;
				box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
				display: none;
				pointer-events: none;
				min-width: 170px;
			}
			#trail-stats span {
				display: block;
				margin-bottom: 10px;
				color: rgba(141, 212, 157, 0.95);
				font-family: 'Inter', sans-serif;
				font-weight: 500;
				font-size: 0.7rem;
				letter-spacing: 1.8px;
				text-transform: uppercase;
			}
			#trail-stats span:last-child { margin-bottom: 0; }
			#trail-stats span strong {
				display: block;
				color: #ffffff;
				font-family: 'Archivo Black', sans-serif;
				font-size: 0.95rem;
				letter-spacing: 0.5px;
				margin-top: 2px;
			}

			.photo-popup .leaflet-popup-content-wrapper {
				background: #050a06;
				color: #ffffff;
				border: 1px solid #5ea66e; 
				border-radius: 8px;
				font-family: 'Archivo Black', sans-serif;
				text-transform: uppercase;
				text-align: center;
				letter-spacing: 1px;
			}
			.photo-popup .leaflet-popup-tip { background: #050a06; }
			.photo-popup img {
				width: 160px;
				height: auto;
				border-radius: 4px;
				margin-top: 8px;
				border: 1px solid #2a2a2a;
			}
		</style>
	</head>
	<body class="is-preload">

		<header id="header" class="alt">
			<a href="../unlocked.html" class="back-btn">&#8592; Exit</a>
			
			<h1><a href="../index.html">HIXZ</a></h1>
			<nav id="nav">
				<ul>
					<li class="special">
						<a href="#menu" class="menuToggle"><span>Menu</span></a>
						<div id="menu">
							<ul>
								<li><a href="../unlocked.html">Back to Trails</a></li>
								<li><a href="../generic.html">About Me</a></li>
							</ul>
						</div>
					</li>
				</ul>
			</nav>
		</header>

		<div id="locating-overlay">Locating...</div>
		<div id="map"></div>

		<div id="trail-stats">
			<span id="stat-dist">Distance: <strong>Loading...</strong></span>
			<span id="stat-time">Est. Time: <strong>1 HR 30 MIN</strong></span>
			<span id="stat-diff">Difficulty: <strong>MODERATE</strong></span>
		</div>

		<div class="button-container">
			<button class="google-btn" onclick="getLocation()">Find My Location</button>
		</div>

		<script src="../assets/js/jquery.min.js"></script>
		<script src="../assets/js/browser.min.js"></script>
		<script src="../assets/js/breakpoints.min.js"></script>
		<script src="../assets/js/util.js"></script>
		<script src="../assets/js/main.js"></script>
		
		<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>

		<script>
			var satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: '&copy; Esri', keepBuffer: 8 });
			var streets = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OSM', keepBuffer: 8 });
			var terrain = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', { attribution: '&copy; Esri', keepBuffer: 8 });

			var map = L.map('map', { center: [12.5092, -69.9702], zoom: 12, layers: [satellite], preferCanvas: true });
			
			var baseMaps = {
				"Satellite": satellite,
				"Streets": streets,
				"Terrain": terrain
			};
			L.control.layers(baseMaps, null, { collapsed: false }).addTo(map);

			// ALTO VISTA GPX
			var gpxFile = '../GPX/Boroncana__Alto_Vista_Kapel.gpx';

			var invisiblePixel = 'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=';
			var blueMarkerUrl = 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png';

			var trailLayer = new L.GPX(gpxFile, {
				async: true,
				marker_options: { 
					startIconUrl: '../images/hiker.gif',
					endIconUrl: invisiblePixel,      
					shadowUrl: invisiblePixel,       
					wptIconUrls: { '': blueMarkerUrl },
					iconSize: [35, 35], 
					iconAnchor: [17, 35]
				},
				polyline_options: { color: '#00ccff', weight: 6, opacity: 0.9 }
			});

			trailLayer.on('addpoint', function(e) {
				if (e.point_type === 'waypoint') {
					var photoHTML = '<div class="photo-popup"><strong>Scenic Spot</strong><br><img src="../images/altovista_view.jpg" alt="Trail View"></div>';
					e.point.bindPopup(photoHTML);
				}
			});

			trailLayer.on('loaded', function(e) {
				map.fitBounds(e.target.getBounds());
				var distanceKm = (e.target.get_distance() / 1000).toFixed(2);
				document.getElementById('stat-dist').innerHTML = 'Distance: <strong>' + distanceKm + ' KM</strong>';
				document.getElementById('trail-stats').style.display = 'block';
			}).addTo(map);

			var userMarker, userCircle;
			
			function getLocation() { 
				document.getElementById('locating-overlay').classList.add('active');
				map.locate({setView: true, maxZoom: 17, maximumAge: 10000}); 
			}
			
			map.on('locationfound', function(e) {
				document.getElementById('locating-overlay').classList.remove('active');
				
				if (userMarker) { map.removeLayer(userMarker); }
				if (userCircle) { map.removeLayer(userCircle); }
				userCircle = L.circle(e.latlng, { radius: 15, color: '#1e90ff', fillOpacity: 0.3 }).addTo(map);
				userMarker = L.circleMarker(e.latlng, { radius: 8, color: 'white', fillColor: '#1e90ff', fillOpacity: 1, weight: 3 }).addTo(map);
				userMarker.bindPopup("You are here!").openPopup();
			});

			map.on('locationerror', function(e) {
				document.getElementById('locating-overlay').classList.remove('active');
				alert("Could not find your location. Please check your device permissions.");
			});
		</script>
	</body>
</html>
