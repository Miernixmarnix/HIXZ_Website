<!DOCTYPE HTML>
<html>
	<head>
		<title>Calbas Loop - HIXZ</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
		<link rel="stylesheet" href="../assets/css/main.css" />
		<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
		
		<style>
			body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #050a06; }
			
			#map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; background: #2a2a2a; }
			.leaflet-pane img, .leaflet-tile-container img { max-width: none !important; width: auto !important; }
			
			#header { position: absolute; top: 0; width: 100%; z-index: 1000; background: rgba(5, 10, 6, 0.8); height: 3.25em; line-height: 3.25em; }
			#header h1 { position: absolute; left: 50%; transform: translateX(-50%); margin: 0; }
			
			.back-btn {
				position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
				display: inline-flex; align-items: center; justify-content: center;
				background-color: #1b3022; color: #ffffff !important; padding: 8px 18px;
				border-radius: 50px; text-decoration: none; font-family: 'Archivo Black', sans-serif;
				font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
				transition: all 0.3s ease; border: 1px solid #ffffff;
				box-shadow: 0 4px 10px rgba(0,0,0,0.3); line-height: normal;
			}
			.back-btn:hover { background-color: #ffffff; color: #050a06 !important; }

			.button-container {
				position: absolute; bottom: 40px; left: 0; width: 100%;
				display: flex; justify-content: center; z-index: 1000; pointer-events: none;
			}
			
			.google-btn {
				pointer-events: auto;
				display: inline-flex; align-items: center; justify-content: center;
				background-color: #1b3022; color: #ffffff !important; padding: 14px 36px;
				border-radius: 50px; text-decoration: none; font-family: 'Archivo Black', sans-serif;
				font-size: 14px; letter-spacing: 1px; text-transform: uppercase;
				transition: all 0.3s ease; border: 1px solid #ffffff; cursor: pointer;
				box-shadow: 0 4px 15px rgba(0,0,0,0.5);
			}
			.google-btn:hover { background-color: #ffffff; color: #050a06 !important; }

			#locating-overlay {
				position: absolute; top: 0; left: 0; width: 100%; height: 100%;
				background: rgba(5, 10, 6, 0.9); color: #ffffff;
				display: flex; align-items: center; justify-content: center;
				z-index: 9999; font-family: 'Archivo Black', sans-serif;
				font-size: 2.5rem; letter-spacing: 2px; text-transform: uppercase;
				opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
			}
			#locating-overlay.active { opacity: 1; pointer-events: all; }
			
			.leaflet-control-zoom, .leaflet-control-layers { margin-top: 80px !important; }
			
			.leaflet-control-layers-expanded {
				background: #ffffff !important;
				padding: 12px !important;
				border-radius: 8px !important;
			}
			.leaflet-control-layers label {
				display: flex !important;
				align-items: center !important;
				color: #000000 !important;
				font-family: sans-serif !important;
				font-size: 14px !important;
				margin: 5px 0 !important;
			}
			.leaflet-control-layers input[type="radio"] {
				appearance: auto !important; 
				-webkit-appearance: radio !important;
				opacity: 1 !important;
				position: relative !important;
				margin-right: 8px !important;
			}

			#trail-stats {
				position: absolute;
				top: 220px; 
				right: 15px;
				background: rgba(5, 10, 6, 0.9);
				color: #ffffff;
				padding: 12px 18px;
				border-radius: 8px;
				border: 1px solid #5ea66e; 
				z-index: 1000;
				font-family: 'Archivo Black', sans-serif;
				font-size: 12px;
				text-transform: uppercase;
				letter-spacing: 1px;
				box-shadow: 0 4px 15px rgba(0,0,0,0.5);
				display: none; 
				pointer-events: none;
			}
			#trail-stats span {
				display: block;
				margin-bottom: 6px;
				color: #5ea66e; 
			}
			#trail-stats span:last-child { margin-bottom: 0; }
			#trail-stats span strong { color: #ffffff; }

			.photo-popup .leaflet-popup-content-wrapper {
				background: #ffffff;
				color: #000000;
				border: 1px solid #5ea66e; 
				border-radius: 8px;
				font-family: 'Archivo Black', sans-serif;
				text-transform: uppercase;
				text-align: center;
				letter-spacing: 1px;
			}
			.photo-popup .leaflet-popup-tip { background: #ffffff; }
			.photo-popup img {
				width: 320px !important; 
				max-width: 320px !important; 
				height: auto !important;
				border-radius: 4px;
				margin-top: 8px;
				border: 1px solid #e0e0e0;
			}
			.fun-fact-text {
				font-family: sans-serif;
				font-size: 15px;
				font-weight: bold;
				text-transform: none;
				color: #000000;
				margin-top: 10px;
				line-height: 1.4;
				text-align: center;
			}

			/* --- NEW PULSING BEACON STYLES --- */
			.custom-beacon {
				background: transparent;
				border: none;
			}
			.beacon-core {
				width: 22px;
				height: 22px;
				background-color: #00ccff; /* Matches trail line */
				border-radius: 50%;
				border: 3px solid #ffffff;
				box-shadow: 0 2px 6px rgba(0,0,0,0.6);
				position: relative;
				cursor: pointer;
				transition: transform 0.2s ease-in-out;
			}
			.beacon-core:hover {
				transform: scale(1.2); /* Slightly enlarges on hover */
			}
			.beacon-core::before {
				content: '';
				position: absolute;
				top: -12px;
				left: -12px;
				right: -12px;
				bottom: -12px;
				border: 2px solid #00ccff;
				border-radius: 50%;
				animation: pulse 1.5s linear infinite;
			}
			@keyframes pulse {
				0% { transform: scale(0.5); opacity: 1; }
				100% { transform: scale(1.3); opacity: 0; }
			}
		</style>
	</head>
	<body class="is-preload">

		<header id="header" class="alt">
			<a href="#" onclick="exitSecurely(); return false;" class="back-btn">&#8592; Exit</a>
			
			<h1><a href="../index.html">HIXZ</a></h1>
			<nav id="nav">
				<ul>
					<li class="special">
						<a href="#menu" class="menuToggle"><span>Menu</span></a>
						<div id="menu">
							<ul>
								<li><a href="#" onclick="exitSecurely(); return false;">Home</a></li>
								<li><a href="../generic.html">About Me</a></li>
							</ul>
						</div>
					</li>
				</ul>
			</nav>
		</header>

		<div id="locating-overlay">Locating...</div>
		<div id="map"></div>

		<div id="trail-stats">
			<span id="stat-dist">Distance: <strong>Loading...</strong></span>
			<span id="stat-time">Est. Time: <strong>1 HR 15 MIN</strong></span>
			<span id="stat-diff">Difficulty: <strong>EASY</strong></span>
		</div>

		<div class="button-container">
			<button class="google-btn" onclick="getLocation()">Find My Location</button>
		</div>

		<script src="../assets/js/jquery.min.js"></script>
		<script src="../assets/js/browser.min.js"></script>
		<script src="../assets/js/breakpoints.min.js"></script>
		<script src="../assets/js/util.js"></script>
		<script src="../assets/js/main.js"></script>
		
		<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>

		<script>
			function exitSecurely() {
				if (localStorage.getItem('hixz_vip') === 'true') {
					window.location.href = '../unlocked.html';
				} else {
					window.location.href = '../index.html';
				}
			}

			var satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: '&copy; Esri', keepBuffer: 8 });
			var streets = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OSM', keepBuffer: 8 });
			var terrain = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', { attribution: '&copy; Esri', keepBuffer: 8 });

			var map = L.map('map', { center: [12.5092, -69.9702], zoom: 12, layers: [satellite], preferCanvas: true });
			
			var baseMaps = {
				"Satellite": satellite,
				"Streets": streets,
				"Terrain": terrain
			};
			L.control.layers(baseMaps, null, { collapsed: false }).addTo(map);

			// CALBAS GPX
			var gpxFile = '../GPX/Bushiribana_Rondwandeling_vanaf_Calbas.gpx';

			var invisiblePixel = 'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=';

			var trailLayer = new L.GPX(gpxFile, {
				async: true,
				marker_options: { 
					startIconUrl: '../images/hiker.gif',
					endIconUrl: invisiblePixel,      
					shadowUrl: invisiblePixel,       
					iconSize: [35, 35], 
					iconAnchor: [17, 35]
				},
				polyline_options: { color: '#00ccff', weight: 6, opacity: 0.9 }
			});

			// Setup arrays for multiple marker images and unique fun facts
			var calbasPhotos = ['CalbasMarker2.jpg', 'CalbasMarker1.jpg'];
			var calbasFacts = [
				'Fun Fact: The Bushiribana ruins were originally built in 1825 to process gold found in the nearby hills.',
				'Scenic View: The rugged northern coast of Aruba offers a striking contrast to the calm southern beaches.'
			];
			var photoIndex = 0;

			trailLayer.on('addpoint', function(e) {
				if (e.point_type === 'waypoint') {
					
					// Apply the new animated custom beacon
					var beaconIcon = L.divIcon({
						className: 'custom-beacon',
						html: '<div class="beacon-core"></div>',
						iconSize: [22, 22],
						iconAnchor: [11, 11] // Centers the custom icon
					});
					e.point.setIcon(beaconIcon);

					// Pulls the image and fact from the arrays, defaulting back to the first if there are more than 2 waypoints
					var currentPhoto = calbasPhotos[photoIndex] ? calbasPhotos[photoIndex] : calbasPhotos[0];
					var currentFact = calbasFacts[photoIndex] ? calbasFacts[photoIndex] : calbasFacts[0];
					
					var photoHTML = '<div class="photo-popup" style="width: 320px;">' +
						'<strong style="font-size: 16px;">Trail Highlight</strong><br>' +
						'<img src="../images/' + currentPhoto + '" alt="Trail View" style="width: 320px; height: auto;">' +
						'<div class="fun-fact-text"><em>' + currentFact + '</em></div>' +
						'</div>';
					
					e.point.bindPopup(photoHTML, { maxWidth: 360, minWidth: 320 });
					photoIndex++;
				}
			});

			trailLayer.on('loaded', function(e) {
				map.fitBounds(e.target.getBounds());
				var distanceKm = (e.target.get_distance() / 1000).toFixed(2);
				document.getElementById('stat-dist').innerHTML = 'Distance: <strong>' + distanceKm + ' KM</strong>';
				document.getElementById('trail-stats').style.display = 'block';
			}).addTo(map);

			var userMarker, userCircle;
			
			function getLocation() { 
				document.getElementById('locating-overlay').classList.add('active');
				map.locate({setView: true, maxZoom: 17, maximumAge: 10000}); 
			}
			
			map.on('locationfound', function(e) {
				document.getElementById('locating-overlay').classList.remove('active');
				
				if (userMarker) { map.removeLayer(userMarker); }
				if (userCircle) { map.removeLayer(userCircle); }
				userCircle = L.circle(e.latlng, { radius: 15, color: '#1e90ff', fillOpacity: 0.3 }).addTo(map);
				userMarker = L.circleMarker(e.latlng, { radius: 8, color: 'white', fillColor: '#1e90ff', fillOpacity: 1, weight: 3 }).addTo(map);
				userMarker.bindPopup("You are here!").openPopup();
			});

			map.on('locationerror', function(e) {
				document.getElementById('locating-overlay').classList.remove('active');
				alert("Could not find your location. Please check your device permissions.");
			});
		</script>
	</body>
</html>
